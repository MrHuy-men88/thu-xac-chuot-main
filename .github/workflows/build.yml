name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Kiểm tra đã có file mô hình chưa
        run: |
          if [ ! -f app/src/main/assets/lan3.tflite ]; then
            echo "THIẾU FILE MÔ HÌNH: chưa thấy app/src/main/assets/lan3.tflite. Hãy tải file lan3.tflite lên đúng thư mục đó rồi chạy lại."
            exit 1
          fi

      - name: Cài Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cài Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Đồng ý điều khoản Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build file APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Lưu file APK để tải về
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
